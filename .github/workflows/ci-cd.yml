name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

    
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notes_backend:latest -f Dockerfile.backend .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notes_backend:latest

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notes_frontend:latest -f Dockerfile.nginx .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notes_frontend:latest

      
      - name: Deploy to VDS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VDS_SSH_PORT }}
          fingerprint: ${{ secrets.VDS_FP }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            set -eux

            mkdir -p ~/Notes_project
            cd ~/Notes_project

            if [ ! -d ".git" ]; then
              git clone https://github.com/raynowww/Notes_project .
            else
              git pull origin master
            fi

            echo "${{ secrets.ENV_FILE }}" | base64 -d > .env
            chmod 600 .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
