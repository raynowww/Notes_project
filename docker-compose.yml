services:
  db:
    image: postgres:15
    container_name: notes_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: notes_backend
    command: gunicorn notes_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./app/BackEnd:/apps
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000" 

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: notes_nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data: